site:
  name: Ballast Wellbeing
  email: info@ballastwellbeing.com
  # PLACEHOLDER — confirmed as Rehman, kept as a variable so the clinical
  # pages can be rebranded with one edit if the practice structure changes.
  practitioner_name: Norman Rehman
  # Set true once the two .woff2 files are in static/fonts/. Until then the
  # preload hints are omitted so a font-less deploy doesn't 404 twice per page.
  fonts_installed: true
  # The counselling section is regulated advertising under CRPO Standard 6.2.
  # While false, its 5 pages are not built at all and its nav and footer links
  # are removed, so v1 can ship the training side without publishing a
  # psychotherapy page full of visible [placeholders]. Flip to true only when
  # every placeholder below is filled.
  counselling_enabled: true
  # Regenerate with `python3 tools/make_og.py` if the wording or brand changes.
  # Fingerprinting rewrites this to the hashed filename at build time, which is
  # what we want: social platforms cache share images hard, and a new hash is
  # the only reliable way to make them refetch.
  og_image: /static/og/default.png
  # Every "Book a free consultation" button on the site links straight out to
  # Jane. There is no booking page here any more, so until this is set the
  # buttons fall back to an email link and the build prints the gap on every
  # run. Set it to the clinic booking URL, e.g.
  #   https://ballastwellbeing.janeapp.com
  jane_url:
  # The counselling and home hero photograph. One image serves both, and the
  # share card for both pages comes from it too. Until it exists the heroes
  # render as a single centred column, which reads as deliberate.
  counselling_photo:
  # Counselling first, then Training as one entry with two items beneath it.
  # An item with `children` renders as a disclosure rather than a link, because
  # there is no /training page for it to point at.
  nav:
    - {label: Counselling, url: /counselling}
    - label: Training
      children:
        - {label: Schools,    url: /schools}
        - {label: Workplaces, url: /workplaces}
  # /about is gone with this rewrite, so the Practice column leads with the
  # counselling page, which now carries the credentials.
  footer_columns:
    - heading: Training
      links:
        - {label: Schools,              url: /schools}
        - {label: Workplaces,           url: /workplaces}
        - {label: Approach,             url: /approach}
        - {label: Verify a certificate, url: /verify}
    - heading: Practice
      links:
        - {label: Counselling, url: /counselling}
        - {label: Insights,    url: /insights}
        - {label: Contact,     url: /contact}

# Values only Norman can supply. Fill these in and the visible [markers]
# across the counselling section disappear. `python3 build.py --check` fails
# while any are still blank, so the section cannot ship half-finished.
placeholders:
  crpo_number: "14804"
  # supervisor: removed deliberately. The name is not published; the pages
  # disclose that supervision happens and offer the name on request. Norman
  # puts the supervisor on receipts in Jane, which is where CRPO requires it.
  # practice_address: removed. The practice is virtual only — telephone and
  # secure video. If an office is added later, restore this key and put the
  # in-person option back on /counselling and /counselling/schedule.
  accepting_new_clients: "Yes"
  clinical_email: "info@ballastwellbeing.com"
  documentation_rate: "$175"
  payment_methods: "E-transfer, or credit card processed through Jane."
  availability: "Monday to Sunday, 9am to 7pm"
  community_spaces: "2"
